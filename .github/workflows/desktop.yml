name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Forge package
        run: npm run package
      # Electron-тесты запускаются против собранного приложения (Forge .vite
      # build entry), а не dev-сервера; Xvfb даёт headless-дисплей.
      # performance.spec исключён (бюджеты честны только для выделенного
      # железа; запускается вручную: GALLEY_PERF=1 … --workers=1,
      # результаты — в docs/verification.md).
      - name: Electron tests (Xvfb)
        run: xvfb-run --auto-servernum npm run test:desktop
        env:
          CI: true

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Forge package
        run: npm run package
      - name: Electron tests
        run: npm run test:desktop
        env:
          CI: true
