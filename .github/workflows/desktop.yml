name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Electron static security analysis
        run: npm run check:security
      - name: Save security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-security
          path: test-results/security/
          if-no-files-found: warn
      - name: Forge package
        run: npm run package
      # Electron-тесты запускаются против собранного приложения (Forge .vite
      # build entry), а не dev-сервера; Xvfb даёт headless-дисплей.
      # performance.spec исключён (бюджеты честны только для выделенного
      # железа; запускается вручную: GALLEY_PERF=1 … --workers=1,
      # результаты — в docs/verification.md).
      - name: Install Linux window test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool x11-utils
      - name: Electron tests (Xvfb and Openbox)
        run: |
          xvfb-run --auto-servernum sh -c '
            openbox > /tmp/galley-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            npm run test:desktop
          '
        env:
          CI: true
          GALLEY_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/out/Galley Desk-linux-x64/Galley Desk

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Forge package
        run: npm run package
      - name: Locate packaged macOS executable
        run: |
          executable="$PWD/apps/desktop/out/Galley Desk-darwin-$(node -p 'process.arch')/Galley Desk.app/Contents/MacOS/Galley Desk"
          test -x "$executable"
          echo "GALLEY_PACKAGED_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - name: Electron tests
        run: npm run test:desktop
        env:
          CI: true
