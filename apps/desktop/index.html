<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: скрипты только из приложения (внешние origins и inline запрещены),
      навигация ограничивается в main.ts (setWindowOpenHandler + will-navigate).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    />
    <title>Galley Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
